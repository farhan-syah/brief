[package]
name = "sigfold"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Gate large command output behind a token threshold: fold to a head/tail summary on disk, pass small output through untouched"

[dependencies]
dirs = "6"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
