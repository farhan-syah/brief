[package]
name = "brief"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Gate large command output behind a token threshold, with a head/tail summary and complete output on disk"
repository = "https://github.com/farhan-syah/brief"
readme = "README.md"
keywords = ["cli", "terminal", "llm", "context", "output"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
dirs = "6"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
