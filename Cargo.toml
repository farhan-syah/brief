[package]
name = "brief"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Gate large command output behind a token threshold: brief a head/tail summary to the caller, with the full output kept on disk"

[dependencies]
dirs = "6"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
